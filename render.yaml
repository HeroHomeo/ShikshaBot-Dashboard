services:
  # The Python Bot
  - type: web
    name: shikshabot
    env: python
    buildCommand: "cd bot && pip install -r requirements.txt"
    startCommand: "cd bot && python CodeX.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_ENABLED
        value: "true"
      - key: API_PORT
        value: "8000"
      - key: DASHBOARD_API_KEY
        sync: false

  # The Next.js Web Dashboard
  - type: web
    name: shikshabot-dashboard
    env: node
    buildCommand: "cd dashboard && npm install && npm run build"
    startCommand: "cd dashboard && npm start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: "https://shikshabot.onrender.com"
      - key: DASHBOARD_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
